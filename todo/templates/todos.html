{% include "layout.html" %}
  <div class="container">
    <div class="card text-center">
      <div class="card-header">
        Your Todo's!
      </div>
    </div>
    <div class="card-body">
      <h5 class="card-title">
        List of your Todo's!
      </h5>
      <p class="card-text">
        Information regarding stuff that needs to be complete
      </p>
      <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Info</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
        <tbody>
        {% for todo in todos%}
          {% if todos.complete == False %}
            <tr class="pointer">
              <td>{{loop.index}}</td>
              <td>{{todo.title}}</td>
              <td>
                <button onclick="window.location.href=''"></button>
              </td>
            </tr>
        </tbody>
      </table>
    </div>
  </div>
